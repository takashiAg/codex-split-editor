name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.2.3
        required: true
        type: string
      dry_run:
        description: Build and upload the package without creating a tag or release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and a safe version
        env:
          SELECTED_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$SELECTED_REF" == refs/heads/main ]] || {
            echo "Run releases from the main branch." >&2
            exit 1
          }
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must match vMAJOR.MINOR.PATCH." >&2
            exit 1
          }

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    name: Build release archive
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build archive and checksum
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: scripts/package-release.sh "$RELEASE_VERSION"
      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: ${{ inputs.dry_run == false }}
    needs: [validate, ci, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Download tested release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
          path: dist/
      - name: Verify package checksum
        run: cd dist && sha256sum --check codex-split-editor-*.tar.gz.sha256
      - name: Create a tag and release without overwriting existing versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag $RELEASE_VERSION already exists." >&2
            exit 1
          fi
          git tag "$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"
          gh release create "$RELEASE_VERSION" \
            "dist/codex-split-editor-${RELEASE_VERSION}.tar.gz" \
            "dist/codex-split-editor-${RELEASE_VERSION}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_VERSION" \
            --notes "Release $RELEASE_VERSION" \
            --verify-tag
