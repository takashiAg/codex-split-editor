name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tmux and nano on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux nano
      - name: Install tmux and nano on macOS
        if: runner.os == 'macOS'
        run: brew install tmux nano
      - name: Run unit and tmux integration tests
        run: python -m unittest discover -s tests -v

  zellij-integration:
    name: Zellij integration (0.46.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install tmux, nano, and Zellij dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux nano
      - name: Install pinned Zellij 0.46.0
        env:
          ZELLIJ_SHA256: a8ee599eb357b6142443c91506a4ece3aa8811cb75dcf2b28d194bd66853c79d
        run: |
          archive="$RUNNER_TEMP/zellij-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/zellij-org/zellij/releases/download/v0.46.0/zellij-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          echo "$ZELLIJ_SHA256  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/zellij"
          tar -xzf "$archive" -C "$RUNNER_TEMP/zellij"
          sudo install -m 0755 "$RUNNER_TEMP/zellij/zellij" /usr/local/bin/zellij
          zellij --version | grep -F '0.46.0'
      - name: Run Zellij integration test in a background session
        run: tests/run_zellij_integration.sh

  CI:
    name: CI
    if: always()
    needs: [tests, zellij-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          ZELLIJ_RESULT: ${{ needs.zellij-integration.result }}
        run: |
          [[ "$TESTS_RESULT" == success ]]
          [[ "$ZELLIJ_RESULT" == success ]]
